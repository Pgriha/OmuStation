# Це такий собі "універсальний" білд з фішками, які матимуть сенс всюди.
## Змінити під кожен сервер окремо
[adminlogs]
#Назва серверу у адмін нотатках
server_name = "Бззз Ому"
high_log_playtime = -1 # Прибирання зайвих повідомлень адміністрації

## Загальне-загальне
[game]
#Бр-бр-бр та вимкнення перевірки айпі
hostname = "Cotton Cheeburbr Omu"
desc = "Ммм. . . Ну типу так? Ви зрозуміли. Бавовняний сирбурбер.\nОмуємо, шановні."
soft_max_players = 20
defaultpreset = "SecretPlusLow"
fallbackpreset = "SecretPlusLow"
maxcharacterslots = 50
panic_bunker.enabled = false
panic_bunker.enable_without_admins = false
round_restart_time = 600
lobbyduration = 300
role_timers = false
role_whitelist = false
ipintel_enabled = false
table_bonk = false
admin_job_tracking = true

[server]
#Бр-бр-бр №2
id = "CheeBurbr"
rules_file = "СheeburbrOverview"

[rules]
#Зменшення таймера на читання правил
time = 15

[chat]
motd = "Вжвжвжвж?"
show_typing_indicator = true

[admin]
# Адмін приколи
admins_count_in_playercount = true
see_own_notes = true
deadmin_on_join = false
server_ban_erase_player = true
server_ban_hwid_ban_default = false

[ic]
#Описи та імена
restricted_names = false
flavor_text = true
punctuation = false

[movement]
#КОЛІІІІІЗІЯ
mob_pushing = false

[atmos]
space_wind = false

[replay]
#Вмикає автозапис реплеїв всього раунду
auto_record = false # true в конфігу сервера, щоб не мучало всіх з локалками
record_admin_chat = false
auto_record_name = "Раунд №{round}-{hour}_{minute}-{day}.{month}.{year}.zip"
max_compressed_size = 1048576 # гігабайт

[shuttle]
#Вимикає раундстарт спавн зайвих мап ваніли №1, зміни еваку та можливість ФТЛити великі шатли
auto_call_time = 0
preload_grids = false
emergency_early_launch_allowed = true
emergency_dock_time = 300
emergency_transit_time_min = 120
emergency_transit_time_max = 240
mass_limit = -1

[lavaland]
enabled = true

[salvage]
expedition_duration = 1500 # 25 хвилин. 11 в оригіналі

[worldgen]
enabled = true

[traits]
max_traits = 5
default_points = 5

[heightadjust]
modifies_sprinting = false
modifies_flight = false

[voice]
barks_enabled = true

[lifeline]
rejuvenate = true
reset_mind = false

[gateway]
#Вимикає раундстарт спавн зайвих мап ваніли №2
generator_enabled = false

[procgen]
#Вимикає раундстарт спавн зайвих мап ваніли №3
preload = false

[interaction]
#Менше зайвих повідомлень адміністрації
rate_limit_announce_admins_delay = -1

#Поради нафіг
[tips]
dataset = ""

[ooc]
#ООС під час раундів
enable_during_round = true

[control]
#Більше віконок
storage_limit = 5

[ahelp]
#Ранги адміністрації в АХелпі (красівоє)
admin_prefix = true
admin_prefix_webhook = false

## Чисто технічне. Нема сенсу чипати
[console]
#Я завжди адмін
loginlocal = true
login_host_user = "Pgriha"

[auth]
#Не треба пітвердження від Візардів
mode = 0

[log]
#Логи
path = "logs"
format = "log_%(date)s-%(time)s.txt"
level = 2
enabled = false

[net]
#Технічне
tickrate = 20 # Ому лагуче. . .
port = 1212
bindto = "::,0.0.0.0"
max_connections = 50
lidgren_log_warning = false
lidgren_log_error = false
log_late_msg = false

[dorm_notifier]
enable = false

[hub]
advertise = 0
use_dynamic_hostname = false

[infolinks]
bug_report = "https://github.com/ProjectOmu/OmuStation/issues"
discord = "https://discord.gg/omustation"
github = "https://github.com/ProjectOmu/OmuStation"
website = "https://projectomu.org/"
wiki = "https://wiki.projectomu.org/"
appeal = ""
patreon = "https://savelife.in.ua/donate/#donate-army-card-once"
