# vocal emotes
- type: emote
  id: Hiss
  name: Шипіти
  category: Vocal
  icon: _Goobstation/Interface/Emotes/hiss.png
  whitelist:
    tags:
    - FelinidEmotes
    - HarpyEmotes
    - ReptilianEmotes
    - ThavenEmotes # gds
    - AvaliEmotes # Omu
  blacklist:
    components:
    - BorgChassis
  chatMessages: [шипить]
  chatTriggers:
    - hiss
    - hisses
    - hissing
    - hissed
    - шипить # Cheeburbr. До кінця прототипу
    - шиплять

