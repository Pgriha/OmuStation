# Диски варто зберігати у коробочках для дисків, як не дивно. TODO: Додати більше варіацій
- type: entity
  parent: DiskCase
  id: BrbrDiskCase
  name: коробчка для диска
  description: Кейсик для зберігання компакт дисків. Туди можна покласти одночасно 2 диски або диск та папірець. Від нього тхне тим самим дешевим пластиком з ринку!
  suffix: Сирбурбер
  components:
  - type: Storage # Місце під 2 диски або папірець
    grid:
    - 0,0,0,1
    maxItemSize: Tiny
    whitelist:
      tags:
        - Document
        - CD

