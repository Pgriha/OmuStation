            Captain: [ 1, 1 ]
            AdministrativeAssistant: [ 1, 1 ]
            NanotrasenRepresentative: [ 1, 1 ]
            BlueshieldOfficer: [ 1, 1 ]
            NanotrasenCareerTrainer: [ 1, 1 ]

            # Інженерний
            ChiefEngineer: [ 1, 1 ]
            AtmosphericTechnician: [ 2, 2 ]
            StationEngineer: [ 3, 3 ]
            TechnicalAssistant: [ 3, 3 ]

            # Медичний
            ChiefMedicalOfficer: [ 1, 1 ]
            Paramedic: [ 1, 1 ]
            Chemist: [ 2, 2 ]
            Virologist: [ 1, 1 ]
            MedicalDoctor: [ 3, 3 ]
            MedicalIntern: [ 3, 3 ]
            Psychologist: [ 1, 1 ]

            # Науковий
            ResearchDirector: [ 1, 1 ]
            Scientist: [ 3, 3 ]
