            # Постачання
            Quartermaster: [ 1, 1 ]
            SalvageSpecialist: [ 2, 2 ]
            ShaftMiner: [ 2, 2 ]
            CargoTechnician: [ 3, 3 ]
            Courier: [ 2, 2 ]

            # ШІ
