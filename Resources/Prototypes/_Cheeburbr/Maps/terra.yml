          mapNameTemplate: '{0} Станція Терра {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'DV'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_Cheeburbr/Shuttles/Evac/ntes_yggdrasil.yml
        - type: StationCargoShuttle
          path: /Maps/_Cheeburbr/Shuttles/Cargo/ntcs_duster.yml # В оригіналі інший, але Міюгі сподобався цей великий
        - type: StationJobs
